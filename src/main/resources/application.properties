# FOR IDE CAN ACCESS .ENV WITHOUT DOCKER
spring.config.import=optional:file:.env[.properties]

# NAME
spring.application.name=KBase
# PREFIX
api.prefix=/api/v1

# SERVER PORT
server.port=${APP_PORT:8080}

# DATABASE
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME:kbase}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JWT
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:1800000}

# FILE STORAGE CONFIGURATION
storage.type=local
storage.local.upload-dir=uploads

# MINIO STORAGE CONFIGURATION
#storage.type=minio    # Incomplete
minio.endpoint=http://localhost:9000
minio.access-key=${MINIO_ACCESS_KEY}
minio.secret-key=${MINIO_SECRET_KEY}
minio.bucket=${MINIO_BUCKET}

spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB